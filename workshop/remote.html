<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ريموت الورشة</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@800&family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0A1226;--card:#121B30;--ink:#EAF0FF;--dim:#9AA8C4;--blue:#1D63E0;--line:#24314F}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Readex Pro",sans-serif;padding:16px;display:grid;gap:12px}
h1{font:800 18px Alexandria;margin:0}.st{font-size:13px;color:var(--dim)}.cur{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.cur b{font:800 22px Alexandria;display:block}.notes{color:#C4B5FD;font-size:15px;line-height:1.8;margin-top:6px}
.big{display:grid;grid-template-columns:1fr 2fr;gap:10px}button{font:700 18px "Readex Pro";border:0;border-radius:16px;padding:22px 10px;background:var(--card);color:var(--ink);border:1px solid var(--line)}button.p{background:var(--blue);border-color:var(--blue);font-size:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row button{padding:14px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{padding:10px;font-size:13px;text-align:right}.grid button.on{border-color:var(--blue);color:#93C5FD}</style></head><body>
<h1>ريموت الورشة</h1><div class="st" id="st">جاري الاتصال…</div>
<div class="cur"><span class="st" id="num">—</span><b id="tt">—</b><div class="notes" id="nt"></div></div>
<div class="big"><button id="pv">السابق</button><button class="p" id="nx">التالي</button></div>
<div class="row"><button id="tm">المؤقت: تشغيل / إيقاف</button><button id="trs">إعادة المؤقت</button></div>
<div class="st" id="tl"></div><div class="grid" id="gr"></div>
<script>function MQ(url,clientId,onMsg,onState,auth){const enc=new TextEncoder(),dec=new TextDecoder();let ws,ping,subs=[],open=false,closedByUser=false,retry=1000;
  const str=s=>{const b=enc.encode(s);return [b.length>>8,b.length&255,...b];};
  const len=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;};
  const pkt=(h,body)=>new Uint8Array([h,...len(body.length),...body]);
  function connect(){try{ws=new WebSocket(url,'mqtt');}catch(e){onState&&onState(false);return later();}ws.binaryType='arraybuffer';
    ws.onopen=()=>{ws.send(pkt(0x10,auth?[...str('MQTT'),4,0xC2,0,60,...str(clientId),...str(auth[0]),...str(auth[1])]:[...str('MQTT'),4,2,0,60,...str(clientId)]));};
    let buf=new Uint8Array(0);
    ws.onmessage=ev=>{const d=new Uint8Array(ev.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;
      while(buf.length>=2){let m=1,v=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];v+=(b&127)*m;m*=128;}while(b&128);if(buf.length<i+v)return;
        const h0=buf[0],t=h0>>4,body=buf.slice(i,i+v);buf=buf.slice(i+v);
        if(t===2){open=true;retry=1000;onState&&onState(true);subs.forEach(s=>sub(s,true));clearInterval(ping);ping=setInterval(()=>{try{ws.send(new Uint8Array([0xC0,0]))}catch(e){}},30000);}
        else if(t===3){const tl=(body[0]<<8)|body[1];const topic=dec.decode(body.slice(2,2+tl));let p=2+tl;if((h0>>1&3)>0)p+=2;onMsg&&onMsg(topic,dec.decode(body.slice(p)));}}};
    ws.onclose=()=>{open=false;clearInterval(ping);onState&&onState(false);if(!closedByUser)later();};ws.onerror=()=>{try{ws.close()}catch(e){}};}
  function later(){setTimeout(connect,retry);retry=Math.min(retry*2,8000);}

  let pid=1;function sub(t,re){if(!re&&!subs.includes(t))subs.push(t);if(open)ws.send(pkt(0x82,[pid>>8,pid++&255,...str(t),0]));}
  function pub(t,msg){if(!open)return false;const p=enc.encode(msg);ws.send(pkt(0x30,[...str(t),...p]));return true;}
  connect();return {sub,pub,get open(){return open},close(){closedByUser=true;try{ws.close()}catch(e){}}};}
const WT='ybe-workshop/2a23b94d033a';const WS=[];
function wsStart(onMsg,onSt){['wss://mqtt.eclipseprojects.io:443/mqtt',['wss://public.cloud.shiftr.io:443',['public','public']],'wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'].forEach(u=>{const a=Array.isArray(u)?u[1]:null;u=Array.isArray(u)?u[0]:u;const m=MQ(u,'ws'+Math.random().toString(36).slice(2,10),(t,r)=>{try{const o=JSON.parse(r);if(o&&o.id&&!wsSeen[o.id]){wsSeen[o.id]=1;onMsg(o);}}catch(e){}},()=>onSt&&onSt(WS.filter(x=>x.open).length),a);m.sub(WT);WS.push(m);});}
const wsSeen={};function wsSend(o){o.id=Math.random().toString(36).slice(2);wsSeen[o.id]=1;const s=JSON.stringify(o);WS.forEach(m=>{try{m.pub(WT,s)}catch(e){}});}
const $=i=>document.getElementById(i);const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);let last=null;
const c=(a,v)=>{wsSend({k:'cmd',a,v});if(navigator.vibrate)navigator.vibrate(15);};
$('nx').onclick=()=>c('next');$('pv').onclick=()=>c('prev');$('tm').onclick=()=>c('timer');$('trs').onclick=()=>c('treset');
wsStart(o=>{if(o.k!=='st')return;last=Date.now();$('st').textContent='متصل بالعرض';$('num').textContent=AR(o.i+1)+' / '+AR(o.n);$('tt').textContent=o.t;$('nt').textContent=o.notes||'';
 const m=Math.floor(o.left/60),s=o.left%60;$('tl').textContent='المؤقت: '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(o.run?' (يعمل)':'');
 const g=$('gr');if(g.children.length!==o.titles.length){g.innerHTML='';o.titles.forEach((t,k)=>{const b=document.createElement('button');b.textContent=AR(k+1)+'. '+t;b.onclick=()=>c('go',k);g.appendChild(b);});}[...g.children].forEach((b,k)=>b.classList.toggle('on',k===o.i));},
 n=>{if(n){c('hello');}if(!last)$('st').textContent=n?'متصل بالسيرفر · افتح العرض على الشاشة':'جاري الاتصال…';});
setInterval(()=>{if(last&&Date.now()-last>12000)$('st').textContent='ما يوصل رد من العرض…';},3000);
</script></body></html>
